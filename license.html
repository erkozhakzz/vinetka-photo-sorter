<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VINETKA — Активация</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#090b0c;color:#f5f5f2;font:14px Montserrat,Segoe UI,sans-serif;display:grid;place-items:center;height:100vh}.box{width:360px;padding:28px;border:1px solid #292d30;border-radius:18px;background:#121517;box-shadow:0 30px 90px #0009}.logo{font-size:25px;font-weight:800;letter-spacing:5px}.logo span{color:#ff6a00}small{display:block;color:#969b9e;margin:8px 0 22px;line-height:1.5}input,button{width:100%;height:45px;border-radius:9px;font:inherit}input{border:1px solid #33383c;background:#090b0c;color:white;padding:0 13px;outline:none}input:focus{border-color:#ff6a00}button{margin-top:10px;border:0;background:#ff6a00;color:white;font-weight:700;cursor:pointer}.error{min-height:18px;color:#ff8450;margin-top:10px;font-size:12px}
    </style>
  </head>
  <body>
    <form class="box" id="form">
      <div class="logo">VINETKA<span>.KZ</span></div>
      <small>Бағдарламамен жұмыс істеу үшін лицензия кілтін енгізіңіз.<br />Для работы с программой введите лицензионный ключ.</small>
      <input id="code" type="text" autocomplete="off" autofocus placeholder="VK-XXXX-XXXX-XXXX-XXXX" />
      <button type="submit">Активировать / Іске қосу</button>
      <div class="error" id="error"></div>
      <div style="margin-top:16px; padding-top:14px; border-top:1px solid #292d30; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;">
        <span style="font-size:12px; color:#c7ccd0; font-weight:600;">Кілтті Telegram боттан сатып алу:<br>Купить лицензию в Telegram:</span>
        <div style="background:#fff; border-radius:10px; padding:6px; display:inline-flex;">
          <img src="qr_telegram.svg" alt="QR Telegram" width="110" height="110" style="display:block;">
        </div>
        <button type="button" id="btnTg" style="margin-top:4px; height:38px; background:#229ed9; border:none; border-radius:8px; color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;">
          <svg style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          <span>@vinetka_keys_kz_bot</span>
        </button>
      </div>
    </form>
    <script>
      const { ipcRenderer, shell } = require('electron');
      document.getElementById('btnTg')?.addEventListener('click', () => {
        const tgUrl = 'https://t.me/vinetka_keys_kz_bot';
        if (shell && shell.openExternal) {
          shell.openExternal(tgUrl);
        } else {
          ipcRenderer.invoke('shell:open-external', tgUrl);
        }
      });
      document.getElementById('form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const error = document.getElementById('error');
        error.textContent = 'Тексерілуде… / Проверка…';
        const result = await ipcRenderer.invoke('license:verify', document.getElementById('code').value);
        const messages = {
          not_found: 'Кілт табылмады / Ключ не найден',
          device_mismatch: 'Кілт басқа компьютерге тіркелген / Ключ привязан к другому компьютеру',
          device_limit: 'Құрылғы лимиті аяқталған / Превышен лимит устройств',
          expired: 'Лицензия мерзімі аяқталған / Срок лицензии истёк',
          blocked: 'Лицензия бұғатталған / Лицензия заблокирована',
          network: 'Интернетті тексеріңіз / Проверьте интернет',
        };
        if (!result.ok) error.textContent = messages[result.error] || 'Лицензия жарамсыз / Лицензия недействительна';
      });
    </script>
  </body>
</html>
